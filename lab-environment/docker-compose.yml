services:
  node1:
    build: .
    image: ansible-lab-node:latest
    container_name: node1
    hostname: node1
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${HOME}/ansible-lab/authorized_keys:/root/.ssh/authorized_keys:ro
    networks:
      ansible_lab:
        ipv4_address: 172.28.0.11

  node2:
    image: ansible-lab-node:latest
    container_name: node2
    hostname: node2
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${HOME}/ansible-lab/authorized_keys:/root/.ssh/authorized_keys:ro
    networks:
      ansible_lab:
        ipv4_address: 172.28.0.12
    depends_on:
      - node1

  node3:
    image: ansible-lab-node:latest
    container_name: node3
    hostname: node3
    privileged: true
    cgroup: host
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ${HOME}/ansible-lab/authorized_keys:/root/.ssh/authorized_keys:ro
    networks:
      ansible_lab:
        ipv4_address: 172.28.0.13
    depends_on:
      - node1

networks:
  ansible_lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
