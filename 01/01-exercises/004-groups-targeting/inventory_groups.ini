# Using the course's Docker lab environment (see lab-environment/SETUP.md)?
# These values already match it — no editing needed.
[web]
web1 ansible_host=172.28.0.11
web2 ansible_host=172.28.0.12

[db]
db1 ansible_host=172.28.0.13

[production:children]
web
db

[web:vars]
ansible_user=root
ansible_ssh_private_key_file=~/ansible-lab/ansible_lab_key
role=frontend

[db:vars]
ansible_user=root
ansible_ssh_private_key_file=~/ansible-lab/ansible_lab_key
role=backend
