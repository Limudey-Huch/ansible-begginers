---
- name: Tear down everything this lesson's exercises created
  hosts: localhost
  gather_facts: false
  vars:
    aws_region: eu-north-1
    key_name: radar-course-key
  tasks:
    - name: Find every instance tagged for this course
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": ansible-course-radar
          instance-state-name: [running, stopped, pending]
      register: found

    - name: Terminate them all
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids: "{{ found.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: found.instances | length > 0

    - name: Delete the lab security group
      amazon.aws.ec2_security_group:
        name: radar-lab-sg
        region: "{{ aws_region }}"
        state: absent
      ignore_errors: true   # AWS can take a few seconds to detach the SG after termination — rerun if this fails

    - name: Delete the course key pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
        state: absent
